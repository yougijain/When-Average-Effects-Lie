# Deploys the repo root to GitHub Pages. The site is a single static file
# (index.html) plus the committed figures/, so there is nothing to build -
# this just uploads and publishes.
#
# configure-pages runs with enablement: true, so it creates and configures the
# Pages site itself if the repo doesn't have one yet - no Settings -> Pages
# click needed. That's why this workflow exists: the first run failed with
# "Get Pages site failed ... Not Found" because Pages had never been enabled.
name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
        with:
          # Create the Pages site if it doesn't exist, instead of 404ing.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .          # the action already excludes .git and .github
      - id: deployment
        uses: actions/deploy-pages@v4
